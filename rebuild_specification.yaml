# =============================================================================
# COMPLETE WEBSITE REBUILD SPECIFICATION
# CreativeWebManual-Style Portfolio for Manu Arya - Data Engineer
# =============================================================================

meta:
  created: "2026-01-25"
  purpose: "Complete rebuild specification matching creativewebmanual.com style"
  target: "Editorial, typography-focused, scroll-driven data engineer portfolio"

# =============================================================================
# REFERENCE ANALYSIS: creativewebmanual.com
# =============================================================================
reference_analysis:

  overall_philosophy:
    - "Reading experience over browsing experience"
    - "Typography as the primary visual element"
    - "Minimal imagery - text tells the story"
    - "Scroll reveals narrative progressively"
    - "Dark mode with high contrast text"
    - "Editorial/magazine-style layout"

  color_scheme:
    background: "#0a0a0a"
    text_dim: "rgba(255, 255, 255, 0.15)"
    text_bright: "#ffffff"
    accent: "#00ffc8"

  typography:
    primary_font: "PP Neue Montreal or similar grotesque sans-serif"
    secondary_font: "Monospace for technical labels"
    hero_size: "8-12vw (viewport-relative, HUGE)"
    body_size: "1.2-1.5rem"
    line_height: "1.6-1.8"

  layout_structure:
    - "Full viewport height sections"
    - "Large left/right margins (10-15%)"
    - "Pinned sidebars while content scrolls"
    - "Chapter/section numbering"
    - "Horizontal dividers between sections"

  key_animations:
    word_reveal:
      description: "Text starts grey, becomes white word-by-word as you scroll"
      trigger: "Scroll position (scrub: true)"
      duration: "Tied to scroll distance"
      
    section_pin:
      description: "Section titles pin while content scrolls beside them"
      trigger: "When section reaches top"
      end: "When section content ends"
      
    background_fade:
      description: "Background color smoothly transitions between sections"
      trigger: "Section enters viewport center"
      
    text_scramble:
      description: "Characters shuffle on hover"
      trigger: "Mouse enter"

